<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoku</title>
    <style>
      :root {
        --line: #334155;
        --thick: #0f172a;
        --given: #0f172a;
        --user: #2563eb;
        --bad: #dc2626;
        --highlight: #dbeafe;
        --match: #fde68a;
        --related: #fef3c7;
      }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
      }
      h1 { margin: 0; font-weight: 700; letter-spacing: 0.5px; }
      #board {
        display: grid;
        grid-template-columns: repeat(9, minmax(0, 1fr));
        grid-template-rows: repeat(9, minmax(0, 1fr));
        width: min(402px, 100%);
        aspect-ratio: 1;
        border: 3px solid var(--thick);
        background: var(--thick);
      }
      .cell {
        position: relative;
        width: 100%;
        height: 100%;
        border: 1px solid var(--line);
        background: #fff;
      }
      .cell input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        text-align: center;
        font-size: 20px;
        background: transparent;
        color: var(--user);
        outline: none;
        padding: 0;
        font-family: inherit;
      }
      .cell:focus-within { background: var(--highlight); }
      .cell.given { background: #f1f5f9; }
      .cell.given input { color: var(--given); font-weight: 700; }
      .cell.bad input { color: var(--bad); }
      .cell.related { background: var(--related); }
      .cell.match { background: var(--match); }
      .cell.given.match { background: var(--match); }
      .pencil {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        pointer-events: none;
      }
      .pencil span {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        line-height: 1;
        color: #64748b;
      }
      /* thick separators between 3x3 boxes */
      .cell[data-col="2"], .cell[data-col="5"] { border-right: 2px solid var(--thick); }
      .cell[data-row="2"], .cell[data-row="5"] { border-bottom: 2px solid var(--thick); }
      .controls { display: flex; gap: 12px; }
      button {
        font-size: 15px;
        padding: 10px 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
      }
      button:hover { background: #f1f5f9; }
      #layout {
        display: flex;
        gap: 32px;
        align-items: flex-start;
        justify-content: center;
        width: 100%;
      }
      #game {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: min(402px, 100%);
      }
      #palette { display: flex; gap: 8px; }
      #palette .key {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 600;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        user-select: none;
      }
      #palette .key:hover { background: var(--match); }
      #sidebar, #ladder-sidebar {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 220px;
        max-width: 260px;
      }
      #sidebar { order: -1; }
      #ladder-sidebar { order: 1; }
      #sidebar h2, #ladder-sidebar h2 { margin: 0; font-size: 18px; font-weight: 700; }
      #ladder-stats {
        margin: -4px 0 0 0;
        font-size: 13px;
        color: #64748b;
      }
      #saved, #ladder {
        list-style: none;
        margin: 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        overflow: hidden;
        min-width: 220px;
      }
      #saved li, #ladder li {
        padding: 10px 14px;
        cursor: pointer;
        border-bottom: 1px solid #e2e8f0;
      }
      #saved li { text-transform: capitalize; }
      #saved li:last-child, #ladder li:last-child { border-bottom: none; }
      #saved li:hover, #ladder li:hover { background: #f1f5f9; }
      #saved li.selected, #ladder li.selected { background: var(--highlight); }
      #saved li.selected { font-weight: 600; }
      #ladder li.selected .ladder-title { font-weight: 700; color: var(--user); }
      #saved li.empty, #ladder li.empty { cursor: default; color: #94a3b8; font-style: italic; }
      #saved li.empty:hover, #ladder li.empty:hover { background: #fff; }

      #ladder li {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .ladder-top {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .ladder-rank {
        font-size: 12px;
        font-weight: 700;
        color: #64748b;
      }
      .ladder-title {
        font-size: 14px;
        font-weight: 600;
        text-transform: capitalize;
        color: var(--thick);
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ladder-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: #64748b;
      }
      .badge {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.3px;
        text-transform: uppercase;
      }
      .badge-easy { background: #dcfce7; color: #15803d; }
      .badge-medium { background: #fef9c3; color: #854d0e; }
      .badge-hard { background: #ffedd5; color: #c2410c; }
      .badge-very-hard { background: #fee2e2; color: #b91c1c; }
      .badge-impossible { background: #ede9fe; color: #6b21a8; }

      @media (max-width: 980px) {
        #layout { flex-direction: column; align-items: center; }
        #game { order: 0; }
        #sidebar { order: 1; align-items: center; width: min(402px, 100%); max-width: 402px; }
        #ladder-sidebar { order: 2; align-items: center; width: min(402px, 100%); max-width: 402px; }
        #saved, #ladder { width: 100%; }
      }
      @media (max-width: 480px) {
        body { padding: 16px 12px; }
        .controls { flex-wrap: wrap; justify-content: center; gap: 8px; }
        button { font-size: 14px; padding: 8px 10px; }
        #palette { width: 100%; gap: 4px; }
        #palette .key { width: auto; flex: 1; height: 36px; font-size: 16px; }
      }
      button.primary { background: var(--user); color: #fff; border-color: var(--user); }
      button.primary:hover { background: #1d4ed8; }
      button.active { background: var(--user); color: #fff; border-color: var(--user); }
      #name { margin: 0; font-size: 18px; font-weight: 600; color: #475569; letter-spacing: 0.3px; text-transform: capitalize; }
      #status { min-height: 24px; font-size: 16px; font-weight: 600; }
      #status.win { color: #16a34a; }
      #status.err { color: var(--bad); }
    </style>
  </head>
  <body>
    <h1>Sudoku</h1>
    <div id="layout">
      <aside id="sidebar">
        <h2>Saved Games</h2>
        <ul id="saved"></ul>
        <div class="controls">
          <button id="load">Load</button>
          <button id="delete">Delete</button>
        </div>
      </aside>
      <div id="game">
        <p id="name"></p>
        <div id="board"></div>
        <div id="palette"></div>
        <div class="controls">
          <button id="new" class="primary">New Game</button>
          <button id="reset" title="Reset this puzzle to its starting position">Reset</button>
          <button id="check">Check</button>
          <button id="solve">Solve</button>
          <button id="save">Save</button>
        </div>
        <div class="controls">
          <button id="pencil" title="Toggle pencil marks (or hold Shift while typing)">Pencil</button>
          <button id="clearPencil" title="Remove all pencil marks">Clear Pencil</button>
          <button id="propagate" title="Remove pencil marks that conflict with filled cells (one pass)">Auto Pencil</button>
        </div>
        <div id="status"></div>
      </div>
      <aside id="ladder-sidebar">
        <h2>Ladder</h2>
        <p id="ladder-stats"></p>
        <ul id="ladder"></ul>
        <div class="controls">
          <button id="playLadder">Play</button>
          <button id="resetLadder" title="Reset ladder progress">Reset</button>
        </div>
      </aside>
    </div>

    <script src="ladder_info.js"></script>
    <script src="index.js"></script>
    <script>
      const boardEl = document.getElementById("board");
      const statusEl = document.getElementById("status");
      const nameEl = document.getElementById("name");
      const savedEl = document.getElementById("saved");
      const ladderEl = document.getElementById("ladder");
      const ladderStatsEl = document.getElementById("ladder-stats");
      const playLadderBtn = document.getElementById("playLadder");
      const resetLadderBtn = document.getElementById("resetLadder");
      const inputs = [];
      const cells = [];
      const notes = [];
      let solution = null;
      let selectedName = null;
      let selectedLadderName = null;
      let pencilMode = false;
      let selectedCell = null;

      function buildBoard() {
        boardEl.innerHTML = "";
        inputs.length = 0;
        cells.length = 0;
        notes.length = 0;
        for (let r = 0; r < SIZE; r++) {
          inputs.push([]);
          cells.push([]);
          notes.push([]);
          for (let c = 0; c < SIZE; c++) {
            const wrapper = document.createElement("div");
            wrapper.className = "cell";
            wrapper.dataset.row = r;
            wrapper.dataset.col = c;

            const input = document.createElement("input");
            input.maxLength = 1;
            input.inputMode = "numeric";
            input.addEventListener("input", () => onInput(r, c));
            input.addEventListener("keydown", (e) => onKeyDown(e, r, c));
            input.addEventListener("focus", () => {
              selectedCell = input.readOnly ? null : [r, c];
            });
            input.addEventListener("mouseenter", () => highlightValue(input.value));
            input.addEventListener("mouseleave", clearMatches);

            const pencil = document.createElement("div");
            pencil.className = "pencil";
            for (let n = 1; n <= 9; n++) {
              pencil.appendChild(document.createElement("span"));
            }

            wrapper.appendChild(input);
            wrapper.appendChild(pencil);
            boardEl.appendChild(wrapper);
            inputs[r].push(input);
            cells[r].push(wrapper);
            notes[r].push(new Set());
          }
        }
      }

      function onInput(r, c) {
        const input = inputs[r][c];
        const v = input.value.replace(/[^1-9]/g, "");
        input.value = v;
        if (v) notes[r][c].clear();
        renderNotes(r, c);
        clearStatus();
        markConflicts();
        if (v && isBoardFull() && isBoardCorrect()) {
          setStatus("Solved! Nicely done.", "win");
          markCurrentGameSolved();
        }
      }

      function applyPaletteNumber(n) {
        if (!selectedCell) return;
        const [r, c] = selectedCell;
        const input = inputs[r][c];
        if (input.readOnly) return;
        if (pencilMode) {
          if (input.value !== "") return;
          const set = notes[r][c];
          if (set.has(n)) set.delete(n);
          else set.add(n);
          renderNotes(r, c);
          return;
        }
        input.value = input.value === String(n) ? "" : String(n);
        onInput(r, c);
      }

      // Pencil marks: toggled when pencil mode is on or Shift is held on an empty cell.
      function onKeyDown(e, r, c) {
        const input = inputs[r][c];
        if (input.readOnly) return;
        if (!/^[1-9]$/.test(e.key)) return;
        if (!pencilMode && !e.shiftKey) return;
        e.preventDefault();
        if (input.value !== "") return;
        const n = Number(e.key);
        const set = notes[r][c];
        if (set.has(n)) set.delete(n);
        else set.add(n);
        renderNotes(r, c);
      }

      function renderNotes(r, c) {
        const spans = cells[r][c].querySelectorAll(".pencil span");
        const set = notes[r][c];
        const show = inputs[r][c].value === "";
        for (let n = 1; n <= 9; n++) {
          spans[n - 1].textContent = show && set.has(n) ? n : "";
        }
      }

      function highlightValue(v) {
        clearMatches();
        if (!v) return;
        const related = new Set();
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (inputs[r][c].value !== v) continue;
            const br = r - (r % 3);
            const bc = c - (c % 3);
            for (let i = 0; i < SIZE; i++) {
              related.add(r * SIZE + i);
              related.add(i * SIZE + c);
            }
            for (let rr = br; rr < br + 3; rr++) {
              for (let cc = bc; cc < bc + 3; cc++) related.add(rr * SIZE + cc);
            }
          }
        }
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (inputs[r][c].value === v) cells[r][c].classList.add("match");
            else if (related.has(r * SIZE + c)) cells[r][c].classList.add("related");
          }
        }
      }

      function clearMatches() {
        for (const row of cells) {
          for (const cell of row) cell.classList.remove("match", "related");
        }
      }

      function currentGrid() {
        return inputs.map((row) =>
          row.map((cell) => {
            const v = parseInt(cell.value, 10);
            return Number.isInteger(v) ? v : EMPTY;
          })
        );
      }

      function isBoardFull() {
        return inputs.every((row) => row.every((c) => c.value !== ""));
      }

      function isBoardCorrect() {
        return new Sudoku(currentGrid()).isSolved();
      }

      // Flag any user cell that duplicates a value in its row, column, or box.
      function markConflicts() {
        const grid = currentGrid();
        const model = new Sudoku(grid);
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const cell = cells[r][c];
            if (cell.classList.contains("given") || inputs[r][c].value === "") {
              cell.classList.remove("bad");
              continue;
            }
            const value = grid[r][c];
            grid[r][c] = EMPTY;
            const clash = !canPlaceInGrid(grid, r, c, value);
            grid[r][c] = value;
            cell.classList.toggle("bad", clash);
          }
        }
      }

      function canPlaceInGrid(grid, row, col, value) {
        for (let i = 0; i < SIZE; i++) {
          if (grid[row][i] === value) return false;
          if (grid[i][col] === value) return false;
        }
        const br = row - (row % 3);
        const bc = col - (col % 3);
        for (let r = br; r < br + 3; r++) {
          for (let c = bc; c < bc + 3; c++) {
            if (grid[r][c] === value) return false;
          }
        }
        return true;
      }

      function newGame() {
        const { puzzle, solution: sol } = generatePuzzle();
        const given = puzzle.grid.map((row) => row.slice());
        let name = nameFromPuzzle(puzzle);
        const propResult = runPropagation(given);
        name = propResult.level + " " + name;
        applyState({
          name,
          given,
          values: given.map((row) => row.slice()),
          solution: sol.grid.map((row) => row.slice()),
        });
        selectedName = null;
        selectedLadderName = null;
        refreshSavedList();
        refreshLadderList();
        clearStatus();
      }

      // Rebuild the board from a plain-object state (used by New Game and Load).
      function applyState(state) {
        solution = new Sudoku(state.solution);
        nameEl.textContent = state.name;
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const input = inputs[r][c];
            const wrapper = cells[r][c];
            const isGiven = state.given[r][c] !== EMPTY;
            const v = state.values[r][c];
            input.value = v !== EMPTY ? v : "";
            wrapper.classList.remove("given", "bad", "match", "related");
            wrapper.classList.toggle("given", isGiven);
            input.readOnly = isGiven;
            const savedNotes = state.notes && state.notes[r] ? state.notes[r][c] : null;
            notes[r][c] = new Set(savedNotes || []);
            renderNotes(r, c);
          }
        }
      }

      function collectState() {
        const given = [];
        const values = [];
        for (let r = 0; r < SIZE; r++) {
          given.push([]);
          values.push([]);
          for (let c = 0; c < SIZE; c++) {
            const v = parseInt(inputs[r][c].value, 10);
            const num = Number.isInteger(v) ? v : EMPTY;
            given[r].push(cells[r][c].classList.contains("given") ? num : EMPTY);
            values[r].push(num);
          }
        }
        return {
          name: nameEl.textContent,
          given,
          values,
          notes: notes.map((row) => row.map((set) => [...set])),
          solution: solution.grid.map((row) => row.slice()),
        };
      }

      const STORAGE_KEY = "sudoku-saved-games";
      const SOLVED_LADDER_KEY = "sudoku-solved-ladder";

      function loadSolvedLadder() {
        try {
          const raw = localStorage.getItem(SOLVED_LADDER_KEY);
          return new Set(raw ? JSON.parse(raw) : []);
        } catch {
          return new Set();
        }
      }

      function writeSolvedLadder(solvedSet) {
        localStorage.setItem(SOLVED_LADDER_KEY, JSON.stringify([...solvedSet]));
      }

      function isLadderGameSolved(game, solvedSet) {
        if (solvedSet.has(game.name)) return true;
        const store = loadStore();
        const saved = store.find ? store.find((g) => g.name === game.name) : null;
        if (saved && saved.values && new Sudoku(saved.values).isSolved()) {
          solvedSet.add(game.name);
          writeSolvedLadder(solvedSet);
          return true;
        }
        return false;
      }

      function getUnsolvedLadderGames(limit = 5) {
        const allGames = typeof readLadderInfo === "function" ? readLadderInfo() : [];
        const solved = loadSolvedLadder();
        const unsolved = [];
        for (let i = 0; i < allGames.length; i++) {
          const game = allGames[i];
          if (!isLadderGameSolved(game, solved)) {
            unsolved.push({ ...game, ladderIndex: i + 1 });
            if (unsolved.length === limit) break;
          }
        }
        return { unsolved, total: allGames.length, solvedCount: solved.size };
      }

      function getBadgeClass(level) {
        const key = (level || "").toLowerCase().replace(/\s+/g, "-");
        return `badge-${key}`;
      }

      function refreshLadderList() {
        const { unsolved, total, solvedCount } = getUnsolvedLadderGames(5);
        if (ladderStatsEl) {
          ladderStatsEl.textContent = `${solvedCount} of ${total} solved`;
        }
        ladderEl.innerHTML = "";

        if (unsolved.length === 0) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = total > 0 ? "All ladder games completed! 🎉" : "No ladder games found";
          ladderEl.appendChild(li);
          selectedLadderName = null;
          return;
        }

        const currentPuzzleName = nameEl.textContent;
        const unsolvedNames = unsolved.map((g) => g.name);
        if (!unsolvedNames.includes(selectedLadderName)) {
          selectedLadderName = unsolvedNames.includes(currentPuzzleName) ? currentPuzzleName : unsolvedNames[0];
        }

        for (const game of unsolved) {
          const li = document.createElement("li");
          const isSelected = game.name === selectedLadderName || game.name === currentPuzzleName;
          if (isSelected) li.classList.add("selected");

          const top = document.createElement("div");
          top.className = "ladder-top";

          const rank = document.createElement("span");
          rank.className = "ladder-rank";
          rank.textContent = `#${game.ladderIndex}`;

          const title = document.createElement("span");
          title.className = "ladder-title";
          title.textContent = game.name;

          top.appendChild(rank);
          top.appendChild(title);

          const meta = document.createElement("div");
          meta.className = "ladder-meta";

          const badge = document.createElement("span");
          badge.className = `badge ${getBadgeClass(game.level)}`;
          badge.textContent = game.level;

          const diff = document.createElement("span");
          diff.className = "ladder-diff";
          diff.textContent = `Diff: ${game.difficulty}`;

          meta.appendChild(badge);
          meta.appendChild(diff);

          li.appendChild(top);
          li.appendChild(meta);

          li.addEventListener("click", () => {
            selectedLadderName = game.name;
            selectedName = null;
            refreshSavedList();
            loadLadderGame(game);
          });

          ladderEl.appendChild(li);
        }
      }

      function loadLadderGame(game) {
        if (!game) return;
        const current = collectState();
        let store = loadStore();
        if (current.name) {
          store = [current, ...store.filter((g) => g.name !== current.name)];
          writeStore(store);
        }

        const saved = store.find((g) => g.name === game.name);
        if (saved) {
          applyState(saved);
        } else {
          applyState({
            name: game.name,
            given: game.given,
            values: game.given.map((row) => row.slice()),
            solution: game.solution,
          });
        }
        selectedLadderName = game.name;
        selectedName = null;
        refreshSavedList();
        refreshLadderList();
        clearStatus();
      }

      function markCurrentGameSolved() {
        const name = nameEl.textContent;
        if (!name) return;
        const allGames = typeof readLadderInfo === "function" ? readLadderInfo() : [];
        const isLadder = allGames.some((g) => g.name === name);
        if (isLadder) {
          const solved = loadSolvedLadder();
          if (!solved.has(name)) {
            solved.add(name);
            writeSolvedLadder(solved);
            refreshLadderList();
            setStatus("Solved! Nicely done. Ladder updated!", "win");
          }
        }
      }

      function loadStore() {
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (!raw) return [];
          if (Array.isArray(raw)) return raw;
          if (typeof raw === "object") return Object.values(raw);
          return [];
        } catch {
          return [];
        }
      }

      function writeStore(store) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
      }

      function refreshSavedList() {
        const store = loadStore();
        savedEl.innerHTML = "";
        if (store.length === 0) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = "No saved games";
          savedEl.appendChild(li);
          selectedName = null;
          return;
        }
        if (!store.some((g) => g.name === selectedName)) selectedName = null;
        for (const game of store) {
          const li = document.createElement("li");
          li.textContent = game.name;
          li.classList.toggle("selected", game.name === selectedName);
          li.addEventListener("click", () => {
            selectedName = game.name;
            selectedLadderName = null;
            refreshSavedList();
            refreshLadderList();
          });
          savedEl.appendChild(li);
        }
      }

      function saveGame() {
        const state = collectState();
        let store = loadStore();
        store = [state, ...store.filter((g) => g.name !== state.name)];
        writeStore(store);
        selectedName = state.name;
        refreshSavedList();
        setStatus('Saved "' + state.name + '".', "win");
      }

      function loadGame() {
        const name = selectedName;
        if (!name) return;
        let store = loadStore();
        const state = store.find((g) => g.name === name);
        if (!state) return;

        store = [state, ...store.filter((g) => g.name !== name)];
        writeStore(store);
        applyState(state);
        selectedName = name;
        selectedLadderName = null;
        refreshSavedList();
        refreshLadderList();
        clearStatus();
      }

      function startGame() {
        const store = loadStore();
        if (store.length === 0) {
          newGame();
          return;
        }
        selectedName = store[0].name;
        applyState(store[0]);
        refreshSavedList();
        refreshLadderList();
        clearStatus();
      }

      function deleteGame() {
        const name = selectedName;
        if (!name) return;
        let store = loadStore();
        store = store.filter((g) => g.name !== name);
        writeStore(store);
        selectedName = null;
        refreshSavedList();
        setStatus('Deleted "' + name + '".', "err");
      }

      function check() {
        markConflicts();
        if (!isBoardFull()) {
          setStatus("Keep going, the board isn't full yet.", "err");
          return;
        }
        if (isBoardCorrect()) {
          setStatus("Solved! Nicely done.", "win");
          markCurrentGameSolved();
        } else {
          setStatus("Not quite, keep trying.", "err");
        }
      }

      function solve() {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            inputs[r][c].value = solution.get(r, c);
            cells[r][c].classList.remove("bad");
            notes[r][c].clear();
            renderNotes(r, c);
          }
        }
        setStatus("Here's the solution.", "win");
      }

      function setStatus(text, kind) {
        statusEl.textContent = text;
        statusEl.className = kind || "";
      }
      function clearStatus() {
        statusEl.textContent = "";
        statusEl.className = "";
      }

      const pencilBtn = document.getElementById("pencil");
      pencilBtn.addEventListener("click", () => {
        pencilMode = !pencilMode;
        pencilBtn.classList.toggle("active", pencilMode);
      });

      function addAllPencilMarks() {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (inputs[r][c].readOnly || inputs[r][c].value !== "") continue;
            notes[r][c] = new Set([1, 2, 3, 4, 5, 6, 7, 8, 9]);
            renderNotes(r, c);
          }
        }
      }

      function clearAllPencilMarks() {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            notes[r][c].clear();
            renderNotes(r, c);
          }
        }
      }
      document.getElementById("clearPencil").addEventListener("click", clearAllPencilMarks);

      // One WFC pass over the live board, delegating the logic to the shared
      // propagationPass in index.js and syncing the result back to the DOM.
      function propagateConstraints() {
        // If any empty cell is missing pencil marks, fill them in first instead.
        let missingMarks = false;
        for (let r = 0; r < SIZE && !missingMarks; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (!inputs[r][c].readOnly && inputs[r][c].value === "" && notes[r][c].size === 0) {
              missingMarks = true;
              break;
            }
          }
        }
        if (missingMarks) {
          addAllPencilMarks();
          return;
        }
        const grid = currentGrid();
        const { fills } = propagationPass(grid, notes);
        for (const [r, c, v] of fills) {
          if (!inputs[r][c].readOnly) inputs[r][c].value = v;
        }
        for (let r = 0; r < SIZE; r++)
          for (let c = 0; c < SIZE; c++) renderNotes(r, c);
        clearStatus();
        markConflicts();
        if (isBoardFull() && isBoardCorrect()) {
          setStatus("Solved! Nicely done.", "win");
          markCurrentGameSolved();
        }
      }
      document.getElementById("propagate").addEventListener("click", propagateConstraints);

      function resetGame() {
        const state = collectState();
        applyState({
          name: state.name,
          given: state.given,
          values: state.given.map((row) => row.slice()),
          solution: state.solution,
        });
        clearStatus();
      }

      document.getElementById("new").addEventListener("click", newGame);
      document.getElementById("reset").addEventListener("click", resetGame);
      document.getElementById("check").addEventListener("click", check);
      document.getElementById("solve").addEventListener("click", solve);
      document.getElementById("save").addEventListener("click", saveGame);
      document.getElementById("load").addEventListener("click", loadGame);
      document.getElementById("delete").addEventListener("click", deleteGame);

      playLadderBtn.addEventListener("click", () => {
        const { unsolved } = getUnsolvedLadderGames(5);
        if (unsolved.length === 0) return;
        const target = unsolved.find((g) => g.name === selectedLadderName) || unsolved[0];
        loadLadderGame(target);
      });

      resetLadderBtn.addEventListener("click", () => {
        if (confirm("Reset ladder progress? This will mark all ladder games as unsolved.")) {
          localStorage.removeItem(SOLVED_LADDER_KEY);
          refreshLadderList();
          setStatus("Ladder progress has been reset.", "win");
        }
      });

      function buildPalette() {
        const paletteEl = document.getElementById("palette");
        for (let n = 1; n <= 9; n++) {
          const key = document.createElement("div");
          key.className = "key";
          key.textContent = n;
          key.addEventListener("mouseenter", () => highlightValue(String(n)));
          key.addEventListener("mouseleave", clearMatches);
          // key.addEventListener("click", () => applyPaletteNumber(n));
          paletteEl.appendChild(key);
        }
      }

      buildBoard();
      buildPalette();
      refreshSavedList();
      refreshLadderList();
      startGame();
    </script>
  </body>
</html>
